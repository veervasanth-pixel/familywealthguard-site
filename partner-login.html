<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Partner Login · FamilyGuard360</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0A0E1A;
  color: #F5F1E8;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: 80px 1rem 3rem;
}

/* Nav */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 64px;
  background: #0A0E1A;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  z-index: 50;
}
.nav-logo {
  color: #C5A052;
  font-size: 1.05rem;
  font-weight: 600;
  text-decoration: none;
}
.nav-back {
  color: #9A9382;
  font-size: 0.82rem;
  text-decoration: none;
}
.nav-back:hover { color: #C5A052; }

/* Page layout */
.page {
  max-width: 420px;
  margin: 2rem auto 0;
}

/* Label above card */
.page-label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #C5A052;
  margin-bottom: 0.75rem;
  text-align: center;
}

/* Card */
.card {
  background: #0F1523;
  border: 1px solid rgba(197,160,82,0.2);
  border-top: 2px solid #C5A052;
  border-radius: 16px;
  padding: 2.5rem 2.5rem 2rem;
}

.card h1 {
  font-size: 1.75rem;
  font-weight: 600;
  color: #F5F1E8;
  margin-bottom: 0.4rem;
  line-height: 1.2;
}

.card-sub {
  font-size: 0.87rem;
  color: #9A9382;
  line-height: 1.6;
  margin-bottom: 2rem;
}

/* ── GOOGLE BUTTON ─────────────────────────── */
.google-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 13px 20px;
  background: #1A2540;
  border: 1.5px solid #C5A052;
  border-radius: 10px;
  color: #F5F1E8;
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 1.5rem;
  transition: background 0.2s;
}
.google-btn:hover { background: #1F2E50; }
.google-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.google-logo { width: 20px; height: 20px; flex-shrink: 0; }

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1.5rem;
  font-size: 0.75rem;
  color: #6B6555;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.07);
}

/* Fields */
.field { margin-bottom: 1rem; }
.field label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #9A9382;
  margin-bottom: 5px;
}
.field input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 11px 14px;
  color: #F5F1E8;
  font-size: 0.92rem;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}
.field input::placeholder { color: rgba(255,255,255,0.2); }
.field input:focus { border-color: #C5A052; }

.forgot {
  display: block;
  text-align: right;
  font-size: 0.75rem;
  color: #C5A052;
  text-decoration: none;
  margin-top: 5px;
}

/* Submit */
.submit-btn {
  width: 100%;
  background: #C5A052;
  color: #0A0E1A;
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-size: 0.95rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 0.5rem;
  transition: background 0.2s;
}
.submit-btn:hover { background: #E8C878; }
.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* Messages */
.msg {
  display: none;
  margin-top: 1rem;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 0.83rem;
  text-align: center;
  line-height: 1.5;
}
.msg.error { display: block; background: rgba(224,88,88,0.1); border: 1px solid rgba(224,88,88,0.3); color: #F08080; }
.msg.warning { display: block; background: rgba(197,160,82,0.1); border: 1px solid rgba(197,160,82,0.3); color: #C5A052; }
.msg.success { display: block; background: rgba(46,125,91,0.1); border: 1px solid rgba(46,125,91,0.3); color: #3FA373; }

.card-footer {
  margin-top: 1.5rem;
  text-align: center;
  font-size: 0.78rem;
  color: #6B6555;
}
.card-footer a { color: #C5A052; text-decoration: none; }
</style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <a href="/" class="nav-logo">FamilyGuard360</a>
  <a href="/" class="nav-back">← Back to site</a>
</nav>

<!-- Page -->
<div class="page">
  <div class="page-label">Green Team · Partner Portal</div>

  <div class="card">
    <h1>Welcome back</h1>
    <p class="card-sub">Sign in to access your partner dashboard, schedule time with Veer, and access team resources.</p>

    <!-- Google Button -->
    <button class="google-btn" id="btn-google" type="button">
      <svg class="google-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or sign in with email</div>

    <form id="login-form" novalidate>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="f-email" placeholder="your@email.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="f-password" placeholder="••••••••" autocomplete="current-password"/>
        <a href="#" class="forgot" id="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="submit-btn" id="login-btn">Sign In</button>
      <div class="msg" id="login-msg"></div>
    </form>

    <div class="card-footer">
      Not yet a partner? <a href="/partner-register.html">Request access</a>
    </div>
  </div>
</div>

<script>
// ── YOUR SUPABASE KEYS ────────────────────────────────────────────
const SUPABASE_URL      = 'https://cdbmvguessbzhnmragne.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkYm12Z3Vlc3NiemhubXJhZ25lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1MzEwMTAsImV4cCI6MjA5MTEwNzAxMH0.xkW8v_WIvlISz7Co8B_fNPYlidRlkXLvlP6bL13Jxh0';
// ─────────────────────────────────────────────────────────────────

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function msg(text, type) {
  const el = document.getElementById('login-msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

// ── Google login ──────────────────────────────────────────────────
document.getElementById('btn-google').addEventListener('click', async function() {
  this.disabled = true;
  this.textContent = 'Redirecting…';
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/partner-portal.html' }
  });
  if (error) {
    msg(error.message.includes('not enabled')
      ? 'Google login not enabled. Go to Supabase → Auth → Providers → Google and turn it on.'
      : error.message, 'error');
    this.disabled = false;
    this.innerHTML = '<svg class="google-logo" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Continue with Google';
  }
});

// ── Email login ───────────────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const email = document.getElementById('f-email').value.trim();
  const pass  = document.getElementById('f-password').value;
  if (!email || !pass) { msg('Please enter your email and password.', 'error'); return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in…';

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    msg(error.message, 'error');
    btn.disabled = false; btn.textContent = 'Sign In'; return;
  }

  const { data: profile } = await sb.from('partner_profiles').select('status').eq('id', data.user.id).single();
  if (!profile || profile.status === 'pending') {
    await sb.auth.signOut();
    msg('Your account is pending approval. You\'ll get an email once approved.', 'warning');
    btn.disabled = false; btn.textContent = 'Sign In'; return;
  }
  if (profile.status === 'rejected') {
    await sb.auth.signOut();
    msg('Access not approved. Contact veervasanth@familyguard.life', 'error');
    btn.disabled = false; return;
  }
  window.location.href = '/partner-portal.html';
});

// ── Forgot password ───────────────────────────────────────────────
document.getElementById('forgot-link').addEventListener('click', async function(e) {
  e.preventDefault();
  const email = document.getElementById('f-email').value.trim();
  if (!email) { msg('Enter your email first, then click Forgot Password.', 'error'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/partner-portal.html'
  });
  msg(error ? error.message : 'Reset email sent — check your inbox.', error ? 'error' : 'success');
});

// ── Auto redirect if already logged in ───────────────────────────
(async function() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data: p } = await sb.from('partner_profiles').select('status').eq('id', session.user.id).single();
  if (p && p.status === 'approved') window.location.href = '/partner-portal.html';
})();
</script>
</body>
</html>
